syntax = "proto3";

package acore.app.version;
option csharp_namespace = "Acore.App.Version";
option go_package = "github.com/ImAubrey/acore/app/version";
option java_package = "com.acore.app.version";
option java_multiple_files = true;


message Config {
  string core_version = 1;
  string min_version = 2;
  string max_version = 3;
}
