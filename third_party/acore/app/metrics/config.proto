syntax = "proto3";

package acore.app.metrics;
option csharp_namespace = "Acore.App.Metrics";
option go_package = "github.com/ImAubrey/acore/app/metrics";
option java_package = "com.acore.app.metrics";
option java_multiple_files = true;

// Config is the settings for metrics.
message Config {
  // Tag of the outbound handler that handles metrics http connections.
  string tag = 1;
  string listen = 2;
  // Access key required for HTTP metrics requests. Leave empty to disable auth.
  string access_key = 3;
}
