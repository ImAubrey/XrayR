syntax = "proto3";

package acore.transport.internet.websocket;
option csharp_namespace = "Acore.Transport.Internet.Websocket";
option go_package = "github.com/ImAubrey/acore/transport/internet/websocket";
option java_package = "com.acore.transport.internet.websocket";
option java_multiple_files = true;

message Config {
  string host = 1;
  string path = 2; // URL path to the WebSocket service. Empty value means root(/).
  map<string, string> header = 3;
  bool accept_proxy_protocol = 4;
  uint32 ed = 5;
  uint32 heartbeatPeriod = 6;
}
