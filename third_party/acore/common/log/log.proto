syntax = "proto3";

package acore.common.log;
option csharp_namespace = "Acore.Common.Log";
option go_package = "github.com/ImAubrey/acore/common/log";
option java_package = "com.acore.common.log";
option java_multiple_files = true;

enum Severity {
  Unknown = 0;
  Error = 1;
  Warning = 2;
  Info = 3;
  Debug = 4;
}
