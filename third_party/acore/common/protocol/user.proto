syntax = "proto3";

package acore.common.protocol;
option csharp_namespace = "Acore.Common.Protocol";
option go_package = "github.com/ImAubrey/acore/common/protocol";
option java_package = "com.acore.common.protocol";
option java_multiple_files = true;

import "common/serial/typed_message.proto";

// User is a generic user for all protocols.
message User {
  uint32 level = 1;
  string email = 2;

  // Protocol specific account information. Must be the account proto in one of
  // the proxies.
  acore.common.serial.TypedMessage account = 3;
}
