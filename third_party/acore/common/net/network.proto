syntax = "proto3";

package acore.common.net;
option csharp_namespace = "Acore.Common.Net";
option go_package = "github.com/ImAubrey/acore/common/net";
option java_package = "com.acore.common.net";
option java_multiple_files = true;

enum Network {
  Unknown = 0;

  TCP = 2;
  UDP = 3;
  UNIX = 4;
}

// NetworkList is a list of Networks.
message NetworkList { repeated Network network = 1; }
