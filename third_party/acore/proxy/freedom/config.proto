syntax = "proto3";

package acore.proxy.freedom;
option csharp_namespace = "Acore.Proxy.Freedom";
option go_package = "github.com/ImAubrey/acore/proxy/freedom";
option java_package = "com.acore.proxy.freedom";
option java_multiple_files = true;

import "common/protocol/server_spec.proto";
import "transport/internet/config.proto";

message DestinationOverride {
  acore.common.protocol.ServerEndpoint server = 1;
}

message Fragment {
  uint64 packets_from = 1;
  uint64 packets_to = 2;
  uint64 length_min = 3;
  uint64 length_max = 4;
  uint64 interval_min = 5;
  uint64 interval_max = 6;
  uint64 max_split_min = 7;
  uint64 max_split_max = 8;
}
message Noise {
  uint64 length_min = 1;
  uint64 length_max = 2;
  uint64 delay_min = 3;
  uint64 delay_max = 4;
  bytes packet = 5;
  string apply_to = 6;
}

message Config {
  acore.transport.internet.DomainStrategy domain_strategy = 1;
  DestinationOverride destination_override = 3;
  uint32 user_level = 4;
  Fragment fragment = 5;
  uint32 proxy_protocol = 6;
  repeated Noise noises = 7;
  uint32 testpre = 8;
  // pre-connected TCP keepalive, int64 values of time.Duration.
  // 0 = default (25s), negative = disable.
  int64 preConKeep = 9;
}
