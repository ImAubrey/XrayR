syntax = "proto3";

package acore.proxy.dokodemo;
option csharp_namespace = "Acore.Proxy.Dokodemo";
option go_package = "github.com/ImAubrey/acore/proxy/dokodemo";
option java_package = "com.acore.proxy.dokodemo";
option java_multiple_files = true;

import "common/net/address.proto";
import "common/net/network.proto";

message Config {
  acore.common.net.IPOrDomain address = 1;
  uint32 port = 2;

  map<string, string> port_map = 3;

  // List of networks that the Dokodemo accepts.
  repeated acore.common.net.Network networks = 7;

  bool follow_redirect = 5;
  uint32 user_level = 6;
}
