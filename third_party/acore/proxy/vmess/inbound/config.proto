syntax = "proto3";

package acore.proxy.vmess.inbound;
option csharp_namespace = "Acore.Proxy.Vmess.Inbound";
option go_package = "github.com/ImAubrey/acore/proxy/vmess/inbound";
option java_package = "com.acore.proxy.vmess.inbound";
option java_multiple_files = true;

import "common/protocol/user.proto";

message DetourConfig {
  string to = 1;
}

message DefaultConfig {
  uint32 level = 2;
}

message Config {
  repeated acore.common.protocol.User user = 1;
  DefaultConfig default = 2;
}
